[package]
name = "portalhub"
version = "0.1.0"
edition = "2021"
description = "Backend JSON del portal de ArchiTechIA en Rust (migración progresiva desde Next.js/Prisma)"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "process", "fs", "io-util", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "tls-rustls-ring-webpki"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
futures-util = "0.3"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
bcrypt = "0.15"
regex = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Compilación pensada para un VPS chico (2 CPU, poca RAM): sin LTO ni debug, menos
# codegen-units paralelos de los que hay por defecto en release no ayudan a la memoria, pero
# sí a que el link no se dispare. Un panic en un handler lo atrapa tokio (unwind por defecto):
# el servicio sigue vivo para el resto de las peticiones.
[profile.release]
opt-level = 2
debug = false
codegen-units = 8
lto = false
strip = true
