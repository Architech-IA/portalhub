# /etc/nginx/snippets/portalhub-proxy-largo.conf — igual que portalhub-proxy.conf pero para operaciones
# de minutos (publicar un proyecto, migraciones, cadenas de tareas del Motor).
proxy_pass http://portalhub_rs;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 1800s;
proxy_connect_timeout 3s;
proxy_send_timeout 1800s;
proxy_buffering off;
# Estas operaciones NO deben repetirse en el respaldo (no son idempotentes): sin reintento.
proxy_next_upstream off;
