# /etc/nginx/snippets/portalhub-proxy.conf — ajustes comunes de las rutas servidas por portalhub.
proxy_pass http://portalhub_rs;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Mismos tiempos que el resto del portal: las rutas de IA pueden tardar hasta ~150 s.
proxy_read_timeout 180s;
proxy_connect_timeout 3s;
proxy_send_timeout 180s;
# Solo se reintenta contra el respaldo si NO se llegó a enviar la petición (servicio caído o
# conexión rechazada); una petición ya recibida por Rust nunca se repite en Next.
proxy_next_upstream error;
