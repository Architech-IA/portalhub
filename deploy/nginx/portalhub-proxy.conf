# /etc/nginx/snippets/portalhub-proxy.conf — ajustes comunes de las rutas servidas por portalhub.
proxy_pass http://portalhub_rs;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Las rutas de IA pueden tardar hasta ~170 s; margen para la generación de PRD/arquitectura.
proxy_read_timeout 300s;
proxy_connect_timeout 3s;
proxy_send_timeout 300s;
# Streaming (SSE de notificaciones y comentarios, chats de agentes): sin buffering, cada trozo sale al instante.
proxy_buffering off;
proxy_cache off;
# Solo se reintenta contra el respaldo si NO se llegó a enviar la petición (servicio caído o
# conexión rechazada); una petición ya recibida por Rust nunca se repite en Next.
proxy_next_upstream error;
