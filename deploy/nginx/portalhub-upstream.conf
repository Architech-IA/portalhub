# /etc/nginx/conf.d/portalhub-upstream.conf
#
# Servicio Rust (portalhub) con el propio Next.js del portal como RESPALDO: si el servicio Rust
# no responde (caído, reiniciando, sin memoria), nginx reenvía la petición a Next (puerto 3003),
# que todavía tiene la implementación original de cada ruta. Las rutas migradas nunca quedan
# fuera de servicio por culpa del servicio nuevo.
upstream portalhub_rs {
    server 127.0.0.1:3100 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:3003 backup;
    keepalive 16;
}
