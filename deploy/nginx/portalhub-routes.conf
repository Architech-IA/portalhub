# /etc/nginx/portalhub-routes.conf — TODA la API (/api/*) la sirve Rust (portalhub).
# Next.js queda solo para las PÁGINAS (y como respaldo del upstream si portalhub cae).
#
# Se incluye dentro del `server` de portal.architechia.co, ANTES de `location /`.
#
# Rollback:
#  - una sola área:  añadir arriba de `location /api/` un `location ~ ^/api/<area>(/|$) { include snippets/next-proxy.conf; }`
#  - la autenticación: ver /etc/nginx/portalhub-auth.conf (ahí se elige quién atiende /api/auth/)
#  - todo: comentar el `include` en el sitio y recargar (`nginx -t && systemctl reload nginx`)

# Quién atiende /api/auth/ (Rust o Next) — archivo aparte para poder devolverlo sin tocar lo demás.
include /etc/nginx/portalhub-auth.conf;

# Operaciones largas: publicar un proyecto (docker build), migraciones, cadenas del Motor.
location ~ ^/api/proyectos/[^/]+/(deploy|db|db/migrar)$ { include snippets/portalhub-proxy-largo.conf; }
location = /api/executor/dispatch-chain                 { include snippets/portalhub-proxy-largo.conf; }

# El resto de la API. La generación con IA puede tardar hasta ~170 s (ver snippets/portalhub-proxy.conf).
# Las respuestas en streaming (SSE y chats de agentes) funcionan porque el snippet apaga el buffering.
location /api/ { include snippets/portalhub-proxy.conf; }
