# /etc/nginx/portalhub-routes.conf — rutas /api/* ya migradas a Rust (se incluye dentro del
# `server` de portal.architechia.co, ANTES de `location /`).
#
# Para devolver un área a Next.js: comentar su línea y `nginx -t && systemctl reload nginx`.
# Para apagar todo: comentar el `include` en el sitio. Ningún cambio de código hace falta.
#
# Las áreas con "(+Next)" las atiende Rust en lo que ya porta y REENVÍA a Next lo demás
# (src/proxy.rs): disparo de tareas del Motor, IA, conversión de documentos...
# Las rutas con streaming (SSE y chats de agentes) NO pasan por Rust: se excluyen acá.

# ── Tanda 1 (PHUB-0001-0002 .. 0006) ──
location ~ ^/api/users$              { include snippets/portalhub-proxy.conf; }  # PHUB-0001-0002
location ~ ^/api/profile$            { include snippets/portalhub-proxy.conf; }  # PHUB-0001-0002
location ~ ^/api/meetings(/|$)       { include snippets/portalhub-proxy.conf; }  # PHUB-0001-0003
location ~ ^/api/dashboard(/|$)      { include snippets/portalhub-proxy.conf; }  # PHUB-0001-0004
location ~ ^/api/leads(/|$)          { include snippets/portalhub-proxy.conf; }  # PHUB-0001-0005/0006
location ~ ^/api/clientes(/|$)       { include snippets/portalhub-proxy.conf; }  # PHUB-0001-0009
location ~ ^/api/prospectos(/|$)     { include snippets/portalhub-proxy.conf; }  # PHUB-0001-0009
location ~ ^/api/niches(/|$)         { include snippets/portalhub-proxy.conf; }  # PHUB-0001-0009
location = /api/prospecting/table    { include snippets/portalhub-proxy.conf; }  # PHUB-0001-0009 (el resto de /api/prospecting sigue en Next)

# ── Tanda 2 — bloque 1: lo que suena en cada pantalla (PHUB-0001-0010) ──
location ~ ^/api/backlog(/|$)        { include snippets/portalhub-proxy.conf; }  # (+Next) aprobar sprint, reactivar bloqueadas, explicar/planear/aplicar plan
location = /api/notifications        { include snippets/portalhub-proxy.conf; }  # /api/notifications/sse sigue en Next
location = /api/sessions             { include snippets/portalhub-proxy.conf; }
location = /api/search               { include snippets/portalhub-proxy.conf; }
location ~ ^/api/agents(/[^/]+)?$    { include snippets/portalhub-proxy.conf; }  # (+Next) /agents/status; los chats (streaming) van directo a Next
location = /api/council/badge        { include snippets/portalhub-proxy.conf; }
location = /api/user-stats           { include snippets/portalhub-proxy.conf; }
location = /api/reportes             { include snippets/portalhub-proxy.conf; }
location = /api/activities           { include snippets/portalhub-proxy.conf; }
location = /api/graph                { include snippets/portalhub-proxy.conf; }
location = /api/projects             { include snippets/portalhub-proxy.conf; }
location = /api/comments             { include snippets/portalhub-proxy.conf; }  # /api/comments/sse sigue en Next
location ~ ^/api/areas(/|$)          { include snippets/portalhub-proxy.conf; }
location ~ ^/api/milestones(/|$)     { include snippets/portalhub-proxy.conf; }
location ~ ^/api/pipeline(/|$)       { include snippets/portalhub-proxy.conf; }
location ~ ^/api/proposals(/|$)      { include snippets/portalhub-proxy.conf; }  # (+Next) /documents (LibreOffice)

# ── Tanda 2 — bloque 2: CRUD de gestión y administración (PHUB-0001-0010) ──
location ~ ^/api/soluciones(/|$)     { include snippets/portalhub-proxy.conf; }  # (+Next) alta (CLI de IA), backfill, generación de PRD/arquitectura
location ~ ^/api/iniciativas(/|$)    { include snippets/portalhub-proxy.conf; }
location ~ ^/api/hitos(/|$)          { include snippets/portalhub-proxy.conf; }
location ~ ^/api/riesgos(/|$)        { include snippets/portalhub-proxy.conf; }
location ~ ^/api/productos(/|$)      { include snippets/portalhub-proxy.conf; }
location ~ ^/api/contabilidad(/|$)   { include snippets/portalhub-proxy.conf; }
location ~ ^/api/rrhh(/|$)           { include snippets/portalhub-proxy.conf; }
location ~ ^/api/finanzas(/|$)       { include snippets/portalhub-proxy.conf; }
location ~ ^/api/inventario(/|$)     { include snippets/portalhub-proxy.conf; }
location ~ ^/api/proveedores(/|$)    { include snippets/portalhub-proxy.conf; }
location ~ ^/api/ordenes(/|$)        { include snippets/portalhub-proxy.conf; }
